# CI: 3-OS matrix build + tests (Release only).
#
# Toolchain per leg:
# - Windows: any recent MSVC via ilammy/msvc-dev-cmd (sets up the full cl
#   environment Ninja needs; microsoft/setup-msbuild only puts msbuild on PATH,
#   which Ninja builds don't use) + Ninja (preinstalled; choco fallback).
#   CC=cl/CXX=cl forced per Ruling 5.
# - macOS: Xcode toolchain from the runner image (xcode-select -p fails loud if
#   absent) + Ninja (image or brew fallback). Universal arm64+x86_64 binary via
#   the single CMAKE_OSX_ARCHITECTURES flag — no lipo handcraft.
# - Linux: GCC + JUCE system deps per JUCE 8.0.15 docs/Linux Dependencies.md
#   (libfreetype-dev / libwebkit2gtk-4.1-dev are the Ubuntu 22/24 names, with
#   older-name fallbacks). Full list installed even though JUCE_USE_CURL=0 and
#   JUCE_WEB_BROWSER=0 are set on the plugin target: ProcessorIOTest links the
#   JUCE modules with default flags, so the headers must exist. cmake/ninja/g++
#   ride the same apt line (no-op if preinstalled).
# Ruling 5 travels: NO MinGW anywhere — native compiler pinned per leg + a
# shared step that fails loud if a MinGW gcc is on PATH.
# Builds all targets as proof (VST3 + AU on macOS + Standalone + tests);
# CI publishes nothing (Standalone is dev-testing; the AU ships in the
# macOS release zip, auval-gated on that leg too).
# No code signing; no installer (manual install per README).
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # sccache backend wiring (per mozilla-actions/sccache-action README —
    # the action alone only installs sccache on local disk): GHA puts the
    # cache in the GitHub cache service (this is what the Caches page
    # shows); MULTIARCH lets the macOS universal (arm64+x86_64 in one
    # clang call) legs cache instead of skipping all 86 compiles.
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_MULTIARCH: "1"
    steps:
      - uses: actions/checkout@v4

      # Compiler cache (sccache): JUCE modules dominate build time. Content-
      # hashed (compiler+flags+sources) so hits are always safe — unlike a
      # build-dir cache, which goes stale across runner-image updates. One
      # step, all legs; the launchers below route every compile through it.
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          ninja --version

      - name: Check Xcode toolchain + Ninja (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode-select -p
          cmake --version
          command -v ninja >/dev/null || brew install ninja
          ninja --version

      - name: Install JUCE deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          DEPS="cmake ninja-build g++ libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfontconfig1-dev libgtk-3-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev"
          sudo apt-get install -y $DEPS libfreetype-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y $DEPS libfreetype6-dev libwebkit2gtk-4.0-dev
          gcc --version
          cmake --version
          ninja --version

      # Ruling 5 (no MinGW compiler) is enforced by the per-leg CC/CXX pins on
      # every configure step below — CMake uses exactly those compilers, so a
      # MinGW on PATH can never leak into a build. (An earlier revision of
      # this workflow scrubbed MinGW out of PATH globally; that broke Windows
      # because bash-form paths poisoned later pwsh steps. Pins, not PATH
      # surgery — recorded so nobody re-adds it.)

      # No -DCMAKE_MAKE_PROGRAM: runner ninja is on PATH (AGENTS.md passes an
      # explicit path only because the local MSYS2 ninja isn't on PATH in cmd).
      - name: "Configure (Windows: Ninja, Release, MSVC)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          CXX: cl
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          Write-Host "CC=$env:CC CXX=$env:CXX"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: "Configure (macOS: Ninja, Release, universal)"
        if: runner.os == 'macOS'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CC" --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: "Configure (Linux: Ninja, Release, GCC)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: gcc
          CXX: g++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CC" --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Default shell per runner (pwsh on Windows, bash elsewhere); both run
      # these verbatim, matching AGENTS.md.
      - name: Build (VST3 + Standalone + tests)
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # auval (ships with macOS, nothing to download): validates the
      # just-built AU the way Logic loads it. Copies the .component into the
      # user Components dir first — auval resolves by type/subtype/manufacturer
      # (aufx AbW5 SA48), not by path. New bundles race the system registrar,
      # so force a rescan and wait until the codes list before validating —
      # otherwise a healthy build fails with "didn't find the component".
      # Nonzero exit fails the leg.
      - name: Validate AU with auval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AbaloneW5_artefacts/Release/AU/Abalone-W5.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for i in $(seq 1 30); do
            auval -a 2>/dev/null | grep -q "AbW5" && break
            sleep 2
          done
          auval -a 2>/dev/null | grep "AbW5" || { echo "AU never registered"; exit 1; }
          auval -v aufx AbW5 SA48

      # pluginval (pinned v1.0.4 binary from Tracktion/pluginval releases —
      # building it from source would double CI time for zero gain). Validates
      # the just-built VST3 bundle at strictness 5 (fast PR gate; level 10
      # runs in the release pipeline + locally, evidenced in docs/pluginval/).
      # Linux runs under xvfb: the Editor test opens a real window. Nonzero
      # exit fails the leg.
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sSL -o $env:TEMP/pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          New-Item -ItemType Directory -Force -Path pv | Out-Null
          Expand-Archive $env:TEMP/pv.zip -DestinationPath pv/ -Force
          ./pv/pluginval.exe --validate build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3 --strictness-level 5

      - name: Validate VST3 with pluginval (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ASSET=pluginval_Linux.zip; PVBIN=pv/pluginval; else ASSET=pluginval_macOS.zip; PVBIN=pv/pluginval.app/Contents/MacOS/pluginval; fi
          curl -sSL -o /tmp/pv.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$ASSET"
          rm -rf pv && mkdir pv && unzip -q -o /tmp/pv.zip -d pv
          chmod +x "$PVBIN"
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN ./"$PVBIN" --validate build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3 --strictness-level 5
