# Release: on version tags (v*), rebuild per OS + ship plugin zips.
#
# Self-contained (own configure+build per leg, not artifact downloads from CI)
# so a tagged build is always fresh and reproducible from the tag alone.
# Per-OS setup mirrors ci.yml (Windows MSVC / macOS Xcode+universal /
# Linux GCC+JUCE deps); see ci.yml header for the why. Upload via
# softprops/action-gh-release (maintained, de-facto standard for tag releases;
# auto-creates the GitHub release; each matrix leg appends its own zip).
# Ships the VST3 bundle on all OSes + the AU component on macOS
# (auval-gated in CI/release; install to ~/Library/Audio/Plug-Ins/Components
# or /Library/Audio/Plug-Ins/Components, then rescan in Logic) + LICENSE +
# README.md per zip — the Standalone is dev-testing and is NOT released.
# Bundle names follow PRODUCT_NAME ("Abalone-W5.vst3" since the SA48/AbW5
# identity commit; the old "Abalone W5.vst3" dir lingering in local build/
# output is pre-rename stale).
# Release notes are edited by hand on the GitHub release page (no body_path:
# automation kept overwriting manual edits).
# Standing caveat: only Windows is host-tested by the author.
# macOS ships VST3 + auval-gated AU; no code signing. Windows ships an
# unsigned Inno Setup installer (installer/windows.iss) alongside the zip —
# SmartScreen warns, the free-plugin standard; static /MT runtime so no VC
# redist is needed. The tag/CMake guard lives on the Windows leg only (the
# installer label is the one place the version string matters): a mismatched
# tag ships zips without an installer — check the red leg before announcing.
# The v* trigger stays broad on purpose (narrow globs risk silently matching
# nothing): the guard above is what rejects malformed tags, loudly.
# No AAX either (Avid SDK + PACE signing required, and Pro Tools refuses
# unsigned builds — ruled out 2026-10-08, VST3+AU covers the hosts).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # Hung leg must never burn the 360-minute default: 60 is 6x the slowest
    # observed leg.
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: windows-latest
            tag: windows
          - os: macos-latest
            tag: macos
          - os: ubuntu-latest
            tag: linux
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Same sccache backend wiring as ci.yml (shared cache: tag legs start warm).
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_MULTIARCH: "1"
    steps:
      - uses: actions/checkout@v4

      # Same sccache setup as ci.yml (shared cache: tag legs start warm).
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          ninja --version

      - name: Check Xcode toolchain + Ninja (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode-select -p
          cmake --version
          command -v ninja >/dev/null || brew install ninja
          ninja --version

      - name: Install JUCE deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          DEPS="cmake ninja-build g++ libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfontconfig1-dev libgtk-3-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev"
          sudo apt-get install -y $DEPS libfreetype-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y $DEPS libfreetype6-dev libwebkit2gtk-4.0-dev
          gcc --version
          cmake --version
          ninja --version

      # Ruling 5 (no MinGW compiler) is enforced by the per-leg CC/CXX pins on
      # every configure step below — CMake uses exactly those compilers, so a
      # MinGW on PATH can never leak into a build. (Mirrors ci.yml: an earlier
      # revision scrubbed MinGW out of PATH globally; that broke Windows
      # because bash-form paths poisoned later pwsh steps. Pins, not PATH
      # surgery — recorded so nobody re-adds it.)

      - name: "Configure (Windows: Ninja, Release, MSVC)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          CXX: cl
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          Write-Host "CC=$env:CC CXX=$env:CXX"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: "Configure (macOS: Ninja, Release, universal)"
        if: runner.os == 'macOS'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CC" --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: "Configure (Linux: Ninja, Release, GCC)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: gcc
          CXX: g++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CC" --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Builds all targets as proof (as CI does); VST3 is packaged on every
      # leg, plus the auval-gated AU component on the mac leg.
      - name: Build (VST3 + Standalone + tests)
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # pluginval at strictness 10 (same gate as CI). Same pinned binary +
      # xvfb arrangement as ci.yml. A failing leg ships no zip (fail-fast
      # is false, each leg gates itself).
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -fsSL -o $env:TEMP/pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          New-Item -ItemType Directory -Force -Path pv | Out-Null
          Expand-Archive $env:TEMP/pv.zip -DestinationPath pv/ -Force
          ./pv/pluginval.exe --validate build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3 --strictness-level 10

      - name: Validate VST3 with pluginval (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ASSET=pluginval_Linux.zip; PVBIN=pv/pluginval; else ASSET=pluginval_macOS.zip; PVBIN=pv/pluginval.app/Contents/MacOS/pluginval; fi
          curl -fsSL -o /tmp/pv.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$ASSET"
          rm -rf pv && mkdir pv && unzip -q -o /tmp/pv.zip -d pv
          chmod +x "$PVBIN"
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN ./"$PVBIN" --validate build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3 --strictness-level 10

      # auval (same arrangement as ci.yml): the mac leg gates the AU the way
      # Logic loads it, before packaging.
      - name: Validate AU with auval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AbaloneW5_artefacts/Release/AU/Abalone-W5.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for i in $(seq 1 30); do
            auval -a 2>/dev/null | grep -q "AbW5" && break
            sleep 2
          done
          auval -a 2>/dev/null | grep "AbW5" || { echo "AU never registered"; exit 1; }
          auval -strict -v aufx AbW5 SA48

      # ZIP_NAME via env keeps ${{ }} out of the script body so the script is
      # statically parse-clean (Task-31 lesson).
      - name: Package VST3 zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIP_NAME: Abalone-W5-${{ github.ref_name }}-${{ matrix.tag }}.zip
        run: |
          $vst3 = "build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "VST3 not found at $vst3" }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -LiteralPath $vst3 -Destination stage/ -Recurse
          Copy-Item -LiteralPath LICENSE, README.md -Destination stage/
          Compress-Archive -LiteralPath stage/"Abalone-W5.vst3", stage/LICENSE, stage/README.md `
            -DestinationPath $env:ZIP_NAME

      # Windows installer (Inno Setup, unsigned — SmartScreen warns, the
      # free-plugin standard; static /MT runtime so no VC redist needed).
      # Tag-vs-CMake guard: a mismatched tag would mislabel the installer.
      # The tag arrives via env (never interpolated into script source —
      # tag names can carry hostile characters) and must look like vX.Y.Z.
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y }
          $m = Select-String -CaseSensitive -Path CMakeLists.txt -Pattern '^project\(AbaloneW5 VERSION ([0-9.]+)'
          if (-not $m) { throw "CMakeLists.txt project() line not found" }
          $projVer = $m.Matches[0].Groups[1].Value
          $tagVer = $env:TAG_NAME -replace '^v', ''
          if ($tagVer -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $($env:TAG_NAME)" }
          if ($tagVer -ne $projVer) { throw "tag $tagVer != CMake $projVer" }
          iscc /O"." /DAppVersion="$tagVer" /DOutFile="Abalone-W5-$env:TAG_NAME-windows-setup" installer/windows.iss
          $installer = "Abalone-W5-$env:TAG_NAME-windows-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer output missing: $installer" }

      # macOS ships VST3 + the auval-gated AU component (same bundle
      # auval just validated); Linux stays VST3-only (AU is Apple-only).
      - name: Package VST3+AU zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ZIP_NAME: Abalone-W5-${{ github.ref_name }}-${{ matrix.tag }}.zip
        run: |
          VST3="build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3"
          AU="build/AbaloneW5_artefacts/Release/AU/Abalone-W5.component"
          test -d "$VST3" || { echo "VST3 not found at $VST3"; exit 1; }
          test -d "$AU" || { echo "AU not found at $AU"; exit 1; }
          command -v zip >/dev/null || { echo "zip tool missing"; exit 1; }
          rm -rf stage && mkdir stage
          cp -R "$VST3" "$AU" stage/
          cp LICENSE README.md stage/
          (cd stage && zip -r "../$ZIP_NAME" "Abalone-W5.vst3" "Abalone-W5.component" LICENSE README.md)

      - name: Package VST3 zip (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ZIP_NAME: Abalone-W5-${{ github.ref_name }}-${{ matrix.tag }}.zip
        run: |
          VST3="build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3"
          test -d "$VST3" || { echo "VST3 not found at $VST3"; exit 1; }
          command -v zip >/dev/null || { echo "zip tool missing"; exit 1; }
          rm -rf stage && mkdir stage
          cp -R "$VST3" stage/
          cp LICENSE README.md stage/
          (cd stage && zip -r "../$ZIP_NAME" "Abalone-W5.vst3" LICENSE README.md)

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: Abalone-W5-${{ github.ref_name }}-${{ matrix.tag }}.zip
          fail_on_unmatched_files: true

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: Abalone-W5-${{ github.ref_name }}-windows-setup.exe
          fail_on_unmatched_files: true
