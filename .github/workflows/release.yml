# Release: on version tags (v*), rebuild + ship the VST3 ONLY.
#
# Self-contained (own configure+build, not an artifact download from CI) so a
# tagged build is always fresh and reproducible from the tag alone.
# Ships ONLY "Abalone W5.vst3" (+ LICENSE + README.md) in one zip — the
# Standalone is dev-testing and is NOT released. Upload via
# softprops/action-gh-release (maintained, de-facto standard for tag releases;
# auto-creates the GitHub release, takes a files glob, needs nothing else).
# No code signing (known limitation); no installer (manual install per README).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          ninja --version

      - name: Configure (Ninja, Release)
        shell: pwsh
        env:
          CC: cl
          CXX: cl
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Builds all targets as proof (as CI does); only the VST3 is packaged.
      - name: Build (VST3 + Standalone + tests)
        shell: pwsh
        run: cmake --build build

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Package VST3 zip
        shell: pwsh
        env:
          ZIP_NAME: AbaloneW5-${{ github.ref_name }}-windows-vst3.zip
        run: |
          $vst3 = "build/AbaloneW5_artefacts/Release/VST3/Abalone W5.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "VST3 not found at $vst3" }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -LiteralPath $vst3 -Destination stage/ -Recurse
          Copy-Item -LiteralPath LICENSE, README.md -Destination stage/
          Compress-Archive -LiteralPath stage/"Abalone W5.vst3", stage/LICENSE, stage/README.md `
            -DestinationPath $env:ZIP_NAME

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: AbaloneW5-*-windows-vst3.zip
          generate_release_notes: true
