# Nightly: rebuild dev HEAD per OS + ship rolling `nightly` prerelease.
#
# Cron workflows only run on the DEFAULT branch, so this file lives on main
# but checks out + builds `dev`. Rolling tag: each matrix leg appends its
# zip to the `nightly` prerelease via softprops/action-gh-release (same
# uploader as release.yml), and a final job force-moves the `nightly` tag
# to the built dev SHA only when ALL legs succeed — a failed leg must never
# move the tag, or the skip-if-unchanged guard would see dev == nightly next
# night and skip, leaving that OS's zip missing until the next dev push.
# Skip-if-unchanged guard: no new dev commits since the last nightly tag means
# no build (saves CI legs). Same per-OS setup, sccache, pluginval-10, and
# auval-strict gates as release.yml — nightlies meet the release bar.
# The Standalone is dev-testing and is NOT shipped (same as releases).
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      - name: Compare dev HEAD to nightly tag
        id: diff
        shell: bash
        run: |
          DEV=$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/dev | cut -f1)
          TAG=$(git ls-remote https://github.com/${{ github.repository }}.git refs/tags/nightly | cut -f1)
          echo "sha=$DEV" >> "$GITHUB_OUTPUT"
          if [ -n "$DEV" ] && [ "$DEV" != "$TAG" ]; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"

  nightly:
    needs: guard
    if: needs.guard.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            tag: windows
          - os: macos-latest
            tag: macos
          - os: ubuntu-latest
            tag: linux
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_MULTIARCH: "1"
    steps:
      # Pinned to the guard SHA, not floating `dev`: a push landing mid-run
      # must not mix new binaries with the old tag (tag + release name would
      # lie about what was built).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          ninja --version

      - name: Check Xcode toolchain + Ninja (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode-select -p
          cmake --version
          command -v ninja >/dev/null || brew install ninja
          ninja --version

      - name: Install JUCE deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          DEPS="cmake ninja-build g++ libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfontconfig1-dev libgtk-3-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev"
          sudo apt-get install -y $DEPS libfreetype-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y $DEPS libfreetype6-dev libwebkit2gtk-4.0-dev
          gcc --version
          cmake --version
          ninja --version

      - name: "Configure (Windows: Ninja, Release, MSVC)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          CXX: cl
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          Write-Host "CC=$env:CC CXX=$env:CXX"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DABALONEW5_VERSION_SUFFIX=-nightly

      - name: "Configure (macOS: Ninja, Release, universal)"
        if: runner.os == 'macOS'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CC" --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DABALONEW5_VERSION_SUFFIX=-nightly

      - name: "Configure (Linux: Ninja, Release, GCC)"
        if: runner.os == 'Linux'
        shell: bash
        env:
          CC: gcc
          CXX: g++
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          echo "CC=$CC CXX=$CXX"
          "$CC" --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DABALONEW5_VERSION_SUFFIX=-nightly

      - name: Build (VST3 + Standalone + tests)
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sSL -o $env:TEMP/pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          New-Item -ItemType Directory -Force -Path pv | Out-Null
          Expand-Archive $env:TEMP/pv.zip -DestinationPath pv/ -Force
          ./pv/pluginval.exe --validate build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3 --strictness-level 10

      - name: Validate VST3 with pluginval (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then ASSET=pluginval_Linux.zip; PVBIN=pv/pluginval; else ASSET=pluginval_macOS.zip; PVBIN=pv/pluginval.app/Contents/MacOS/pluginval; fi
          curl -sSL -o /tmp/pv.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$ASSET"
          rm -rf pv && mkdir pv && unzip -q -o /tmp/pv.zip -d pv
          chmod +x "$PVBIN"
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN ./"$PVBIN" --validate build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3 --strictness-level 10

      - name: Validate AU with auval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AbaloneW5_artefacts/Release/AU/Abalone-W5.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for i in $(seq 1 30); do
            auval -a 2>/dev/null | grep -q "AbW5" && break
            sleep 2
          done
          auval -a 2>/dev/null | grep "AbW5" || { echo "AU never registered"; exit 1; }
          auval -strict -v aufx AbW5 SA48

      - name: Package VST3 zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIP_NAME: Abalone-W5-nightly-${{ matrix.tag }}.zip
        run: |
          $vst3 = "build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3"
          if (-not (Test-Path -LiteralPath $vst3)) { throw "VST3 not found at $vst3" }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -LiteralPath $vst3 -Destination stage/ -Recurse
          Copy-Item -LiteralPath LICENSE, README.md -Destination stage/
          Compress-Archive -LiteralPath stage/"Abalone-W5.vst3", stage/LICENSE, stage/README.md `
            -DestinationPath $env:ZIP_NAME

      - name: Package VST3+AU zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ZIP_NAME: Abalone-W5-nightly-${{ matrix.tag }}.zip
        run: |
          VST3="build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3"
          AU="build/AbaloneW5_artefacts/Release/AU/Abalone-W5.component"
          test -d "$VST3" || { echo "VST3 not found at $VST3"; exit 1; }
          test -d "$AU" || { echo "AU not found at $AU"; exit 1; }
          command -v zip >/dev/null || { echo "zip tool missing"; exit 1; }
          rm -rf stage && mkdir stage
          cp -R "$VST3" "$AU" stage/
          cp LICENSE README.md stage/
          (cd stage && zip -r "../$ZIP_NAME" "Abalone-W5.vst3" "Abalone-W5.component" LICENSE README.md)

      - name: Package VST3 zip (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ZIP_NAME: Abalone-W5-nightly-${{ matrix.tag }}.zip
        run: |
          VST3="build/AbaloneW5_artefacts/Release/VST3/Abalone-W5.vst3"
          test -d "$VST3" || { echo "VST3 not found at $VST3"; exit 1; }
          command -v zip >/dev/null || { echo "zip tool missing"; exit 1; }
          rm -rf stage && mkdir stage
          cp -R "$VST3" stage/
          cp LICENSE README.md stage/
          (cd stage && zip -r "../$ZIP_NAME" "Abalone-W5.vst3" LICENSE README.md)

      - name: Upload nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          name: Nightly (${{ needs.guard.outputs.sha }})
          # First-run/recovery: if the tag does not exist yet the action
          # creates it — pin the creation target to the built SHA, never the
          # default branch's HEAD.
          target_commitish: ${{ needs.guard.outputs.sha }}
          files: Abalone-W5-nightly-${{ matrix.tag }}.zip

  # Moved-tag gate: runs once, after every leg, and only on full success.
  # Partial releases (a failed OS leg) never advance the tag, so the guard
  # retriggers next night instead of deadlocking on dev == nightly. Also
  # collapses the old per-leg triple force-push into one.
  tag:
    needs: [guard, nightly]
    if: needs.nightly.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Move nightly tag to built SHA
        shell: bash
        run: |
          git tag -f nightly ${{ needs.guard.outputs.sha }}
          git push -f origin nightly

      - name: Rename nightly prerelease to built SHA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          name: Nightly (${{ needs.guard.outputs.sha }})
          target_commitish: ${{ needs.guard.outputs.sha }}
